<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>厝味・九份山居 — 自助報到系統 UI 設計稿</title>
  <style>
    :root {
      --bg: #f7eedd;
      --bg-soft: #faf3e6;
      --card: #fffdf8;
      --ink: #3a342c;
      --muted: #97897155;
      --muted-text: #9b8d76;
      --accent: #b5623c;
      --accent-soft: #efe6d5;
      --line: #e7dcc6;
      --shadow: 0 18px 40px -24px rgba(88, 62, 33, .45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Header ---- */
    header {
      max-width: 1120px;
      margin: 0 auto;
      padding: 56px 24px 24px;
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .brand-mark {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(150deg, #cbb079, #b7995f);
      color: #fff; font-weight: 700; font-size: 22px;
      display: grid; place-items: center;
      box-shadow: var(--shadow);
    }
    .brand-name { font-size: 17px; font-weight: 600; letter-spacing: .04em; }
    .brand-sub { font-size: 13px; color: var(--muted-text); }

    h1 { font-size: clamp(28px, 4.5vw, 44px); font-weight: 800; letter-spacing: .02em; line-height: 1.25; }
    .lede { margin-top: 14px; max-width: 620px; font-size: 16px; color: #6f6350; }
    .pill {
      font-size: 13px; padding: 7px 14px; border-radius: 999px;
      background: var(--accent-soft); color: #8a5233; font-weight: 500;
    }
    .pill-cta {
      background: var(--accent); color: #fff; text-decoration: none;
      transition: background .18s;
    }
    .pill-cta:hover { background: #a0512e; }

    /* ---- Tabs ---- */
    .tabs {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      margin-top: 32px;
    }
    .tabs-inner { max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 8px; align-items: center; }
    .tabs-inner .pill-cta { margin-left: auto; }
    .tab {
      border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 15px;
      padding: 9px 20px; border-radius: 999px; color: var(--muted-text);
      background: transparent; transition: .18s;
    }
    .tab .count { font-size: 12px; opacity: .7; margin-left: 4px; }
    .tab[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
    .tab:not([aria-selected="true"]):hover { background: var(--accent-soft); color: #8a5233; }

    /* 前台底下的裝置子分頁（放在 divider 下方） */
    .subtabs-inner { max-width: 1120px; margin: 0 auto; padding: 16px 24px 0; display: flex; gap: 8px; align-items: center; }
    .subtab {
      border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 13.5px;
      padding: 6px 15px; border-radius: 999px; color: var(--muted-text);
      background: transparent; transition: .18s;
    }
    .subtab .count { font-size: 11px; opacity: .7; margin-left: 4px; }
    .subtab[aria-selected="true"] { background: var(--accent-soft); color: #8a5233; }
    .subtab:not([aria-selected="true"]):hover { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); color: #8a5233; }

    /* ---- Gallery ---- */
    main { max-width: 1120px; margin: 0 auto; padding: 16px 24px 90px; }
    .grid { display: grid; gap: 26px; }
    .grid.mobile { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .grid.pc     { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
    .grid.admin  { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }

    .panel { display: none; }
    .panel.active { display: block; animation: fade .35s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    figure {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      overflow: hidden; cursor: zoom-in; transition: .2s; box-shadow: var(--shadow);
    }
    figure:hover { transform: translateY(-4px); border-color: #d9c9a6; }
    .thumb { background: var(--bg-soft); display: grid; place-items: center; padding: 16px; }
    .grid.mobile .thumb {
      padding: 16px 16px 0;
      aspect-ratio: 39 / 84;          /* 統一比例框 → 手機卡片等高、標籤對齊 */
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .thumb img { width: 100%; height: auto; display: block; border-radius: 10px; }
    .grid.mobile .thumb img { height: 100%; object-fit: contain; object-position: top center; }
    .grid.pc .thumb {
      padding: 14px 14px 0;
      aspect-ratio: 1490 / 1096;      /* 統一比例框 → 電腦卡片等高、標籤對齊 */
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .grid.pc .thumb img { height: 100%; object-fit: contain; object-position: top center; }
    .grid.admin .thumb {
      padding: 14px 14px 0;
      aspect-ratio: var(--ar, 1514 / 947);  /* 每節以節內最高圖設定比例框 → 節內卡片等高、標籤對齊 */
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .grid.admin .thumb img { height: 100%; object-fit: contain; object-position: top center; }

    /* ---- 後台分節（依側邊欄資訊架構） ---- */
    .jumpbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
    .jump {
      border: 1px solid var(--line); cursor: pointer; font: inherit; font-weight: 600; font-size: 13px;
      padding: 6px 14px; border-radius: 999px; color: var(--muted-text); background: var(--card);
      transition: .18s;
    }
    .jump .count { font-size: 11px; opacity: .7; margin-left: 4px; }
    .jump:hover { background: var(--accent-soft); border-color: transparent; color: #8a5233; }
    .admin-group {
      display: flex; align-items: center; gap: 14px;
      font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--muted-text);
      margin: 40px 0 18px;
    }
    .admin-group::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
    .jumpbar + .admin-group { margin-top: 26px; }
    .admin-sec { scroll-margin-top: 84px; }
    .admin-sec + .admin-sec { margin-top: 36px; }
    .admin-sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .admin-sec-head h2 { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
    .admin-sec-head .count { font-size: 12.5px; color: var(--muted-text); }
    .tag-modal {
      flex: none; margin-left: auto; align-self: center;
      font-size: 11px; font-weight: 600; color: var(--muted-text);
      border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
    }
    figcaption {
      display: flex; align-items: baseline; gap: 10px;
      padding: 14px 18px 16px; font-size: 14.5px;
    }
    figcaption .no {
      font-size: 12px; font-weight: 700; color: var(--accent);
      background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; flex: none;
    }
    figcaption .t { font-weight: 600; }

    footer { max-width: 1120px; margin: 0 auto; padding: 0 24px 60px; color: var(--muted-text); font-size: 13px; }
    footer hr { border: 0; border-top: 1px solid var(--line); margin-bottom: 20px; }

    /* ---- 懸浮「回到最上層」 ---- */
    .to-top {
      position: fixed; right: 26px; bottom: 26px; z-index: 50;
      width: 46px; height: 46px; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 20px;
      display: grid; place-items: center; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transform: translateY(8px); transition: .25s;
    }
    .to-top.show { opacity: 1; pointer-events: auto; transform: none; }
    .to-top:hover { background: #a0512e; }

    /* ---- Lightbox ---- */
    .lb { position: fixed; inset: 0; z-index: 60; display: none;
      background: rgba(42, 32, 20, .82); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 30px; }
    .lb.open { display: flex; }
    .lb img { max-width: 100%; max-height: 92vh; border-radius: 12px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); }
    .lb-close, .lb-nav {
      position: absolute; border: 0; cursor: pointer; color: #fff;
      background: rgba(255,255,255,.14); border-radius: 999px; width: 46px; height: 46px;
      font-size: 22px; display: grid; place-items: center; transition: .15s;
    }
    .lb-close:hover, .lb-nav:hover { background: rgba(255,255,255,.28); }
    .lb-close { top: 22px; right: 22px; }
    .lb-nav.prev { left: 22px; top: 50%; transform: translateY(-50%); }
    .lb-nav.next { right: 22px; top: 50%; transform: translateY(-50%); }
    .lb-cap { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: #f3e9d6; font-size: 14px; }
    @media (max-width: 560px) { .lb-nav { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">厝</div>
      <div>
        <div class="brand-name">厝味・九份山居</div>
        <div class="brand-sub">自助報到系統</div>
      </div>
    </div>
    <h1>自助報到系統 · UI 設計稿</h1>
    <p class="lede">
      旅客從連結進入即可自助完成報到：確認訂單、上傳證件、同意住宿須知、線上付款，
      完成後直接取得大門與房門密碼。以下為旅客端手機版、電腦版，以及民宿後台管理的完整畫面。
    </p>
  </header>

  <nav class="tabs">
    <div class="tabs-inner" role="tablist" aria-label="介面分類">
      <button class="tab" role="tab" aria-selected="true"  data-group="front">前台</button>
      <button class="tab" role="tab" aria-selected="false" data-group="admin">後台<span class="count">18</span></button>
      <a class="pill pill-cta" href="flow.html">報到流程總覽 →</a>
      <!-- 暫時隱藏：設計系統入口（要恢復時取消此註解即可）
      <a class="pill pill-cta" href="design-system/styleguide.html">設計系統 →</a>
      -->
    </div>
  </nav>

  <div class="subtabs-inner" id="subtabs" role="tablist" aria-label="前台裝置">
    <button class="subtab" role="tab" aria-selected="true"  data-panel="mobile">手機版<span class="count">9</span></button>
    <button class="subtab" role="tab" aria-selected="false" data-panel="pc">電腦版<span class="count">9</span></button>
  </div>

  <main>
    <section class="panel active" id="panel-mobile">
      <div class="grid mobile" id="grid-mobile"></div>
    </section>
    <section class="panel" id="panel-pc">
      <div class="grid pc" id="grid-pc"></div>
    </section>
    <section class="panel" id="panel-admin"></section>
  </main>

  <footer>
    <hr />
    厝味・九份山居 — 自助報到系統 UI 設計稿 · 本頁僅供業者預覽，畫面與資料為示意。
  </footer>

  <button class="to-top" id="toTop" aria-label="回到最上層">↑</button>

  <div class="lb" id="lb" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="關閉">✕</button>
    <button class="lb-nav prev" id="lbPrev" aria-label="上一張">‹</button>
    <img id="lbImg" alt="" />
    <button class="lb-nav next" id="lbNext" aria-label="下一張">›</button>
    <div class="lb-cap" id="lbCap"></div>
  </div>

  <script>
    const DATA = {
      mobile: [
        ["m01", "進入頁 · 連結含訂單編號"],
        ["m02", "進入頁 · 姓名查詢"],
        ["m03", "進入頁 · 已付款"],
        ["m04", "完成付款"],
        ["m05", "確認訂單"],
        ["m06", "上傳旅客證件"],
        ["m07", "住宿須知"],
        ["m08", "報到完成"],
        ["m09", "民宿資訊"],
      ],
      pc: [
        ["p01", "進入頁 · 連結含訂單編號"],
        ["p02", "進入頁 · 姓名查詢"],
        ["p03", "進入頁 · 已付款"],
        ["p04", "完成付款"],
        ["p05", "確認訂單"],
        ["p06", "上傳旅客證件"],
        ["p07", "住宿須知"],
        ["p08", "報到完成"],
        ["p09", "民宿資訊"],
      ],
    };

    // 後台：依側邊欄資訊架構分節（營運 / 設定）
    // ar = 節內最高圖的寬高比（比例框）；item 第三欄 true = 彈窗狀態圖
    const ADMIN_SECTIONS = [
      { group: "營運", name: "訂單管理", ar: "1514 / 1019", items: [
        ["a01", "訂單列表"],
        ["a02", "訂單詳情"],
        ["a03", "訂單詳情 · 編輯訂單", true],
      ]},
      { name: "證件抽查", ar: "1514 / 802", items: [
        ["a04", "證件抽查"],
      ]},
      { name: "住客清單匯出", ar: "1514 / 862", items: [
        ["a05", "住客清單匯出"],
      ]},
      { group: "設定", name: "館別設定", ar: "1514 / 1091", items: [
        ["a06", "民宿資訊"],
        ["a07", "房間與鑰匙盒"],
        ["a08", "房間與鑰匙盒 · 編輯房間", true],
        ["a09", "房間與鑰匙盒 · 新增房間", true],
        ["a10", "入住步驟與退房"],
        ["a11", "住宿須知"],
        ["a12", "訂房與客服"],
        ["a13", "Email 通知"],
      ]},
      { name: "門禁管理", ar: "1216 / 714", items: [
        ["a14", "門禁管理"],
        ["a15", "新增密碼", true],
      ]},
      { name: "權限管理", ar: "1514 / 859", items: [
        ["a16", "管理員列表"],
        ["a17", "建立管理員", true],
        ["a18", "編輯管理員", true],
      ]},
    ];
    DATA.admin = ADMIN_SECTIONS.flatMap((s) => s.items);

    // Flat list for lightbox navigation, tracks which panel is active
    function buildGrid(kind) {
      const grid = document.getElementById("grid-" + kind);
      DATA[kind].forEach(([id, title], i) => {
        const fig = document.createElement("figure");
        fig.innerHTML =
          '<div class="thumb"><img loading="lazy" src="assets/' + kind + '/' + id +
          '.png" alt="' + title + '"></div>' +
          '<figcaption><span class="no">' + String(i + 1).padStart(2, "0") +
          '</span><span class="t">' + title + '</span></figcaption>';
        fig.addEventListener("click", () => openLb(kind, i));
        grid.appendChild(fig);
      });
    }
    // 後台面板：跳轉列 + 分組（營運/設定）+ 分節網格，編號全域連號
    function buildAdmin() {
      const panel = document.getElementById("panel-admin");
      const jumpbar = document.createElement("div");
      jumpbar.className = "jumpbar";
      panel.appendChild(jumpbar);
      let idx = 0;
      ADMIN_SECTIONS.forEach((sec, s) => {
        if (sec.group) {
          const g = document.createElement("div");
          g.className = "admin-group";
          g.textContent = sec.group;
          panel.appendChild(g);
        }
        const wrap = document.createElement("section");
        wrap.className = "admin-sec";
        wrap.id = "sec-" + s;
        wrap.innerHTML =
          '<div class="admin-sec-head"><h2>' + sec.name + '</h2>' +
          '<span class="count">' + sec.items.length + ' 張</span></div>';
        const grid = document.createElement("div");
        grid.className = "grid admin";
        grid.style.setProperty("--ar", sec.ar);
        sec.items.forEach(([id, title, modal]) => {
          const i = idx++;
          const fig = document.createElement("figure");
          fig.innerHTML =
            '<div class="thumb"><img loading="lazy" src="assets/admin/' + id +
            '.png" alt="' + title + '"></div>' +
            '<figcaption><span class="no">' + String(i + 1).padStart(2, "0") +
            '</span><span class="t">' + title + '</span>' +
            (modal ? '<span class="tag-modal">彈窗</span>' : '') + '</figcaption>';
          fig.addEventListener("click", () => openLb("admin", i));
          grid.appendChild(fig);
        });
        wrap.appendChild(grid);
        panel.appendChild(wrap);
        const chip = document.createElement("button");
        chip.className = "jump";
        chip.innerHTML = sec.name + '<span class="count">' + sec.items.length + '</span>';
        chip.addEventListener("click", () => wrap.scrollIntoView({ behavior: "smooth" }));
        jumpbar.appendChild(chip);
      });
    }

    buildGrid("mobile");
    buildGrid("pc");
    buildAdmin();

    // Tabs — 前台（手機 / 電腦子分頁）與 後台 兩層
    const primaryTabs = document.querySelectorAll(".tab[data-group]");
    const subTabs = document.querySelectorAll(".subtab[data-panel]");
    const subtabsBar = document.getElementById("subtabs");
    let frontPanel = "mobile"; // 記住前台最後選的裝置

    function showPanel(id) {
      document.querySelectorAll(".panel").forEach((p) =>
        p.classList.toggle("active", p.id === "panel-" + id));
    }
    function selectGroup(group) {
      primaryTabs.forEach((t) => t.setAttribute("aria-selected", t.dataset.group === group));
      subtabsBar.style.display = group === "front" ? "" : "none";
      showPanel(group === "front" ? frontPanel : "admin");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    primaryTabs.forEach((t) => t.addEventListener("click", () => selectGroup(t.dataset.group)));
    subTabs.forEach((t) => t.addEventListener("click", () => {
      frontPanel = t.dataset.panel;
      subTabs.forEach((s) => s.setAttribute("aria-selected", s === t));
      showPanel(frontPanel);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }));

    // Lightbox
    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lbImg");
    const lbCap = document.getElementById("lbCap");
    let lbKind = "mobile", lbIdx = 0;

    function openLb(kind, i) { lbKind = kind; lbIdx = i; render(); lb.classList.add("open"); lb.setAttribute("aria-hidden", "false"); }
    function closeLb() { lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true"); }
    function step(d) { const list = DATA[lbKind]; lbIdx = (lbIdx + d + list.length) % list.length; render(); }
    function render() {
      const [id, title] = DATA[lbKind][lbIdx];
      lbImg.src = "assets/" + lbKind + "/" + id + ".png";
      lbImg.alt = title;
      lbCap.textContent = (lbIdx + 1) + " / " + DATA[lbKind].length + " · " + title;
    }

    document.getElementById("lbClose").addEventListener("click", closeLb);
    document.getElementById("lbPrev").addEventListener("click", (e) => { e.stopPropagation(); step(-1); });
    document.getElementById("lbNext").addEventListener("click", (e) => { e.stopPropagation(); step(1); });
    lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });

    // 懸浮「回到最上層」：往下捲才浮現
    const toTop = document.getElementById("toTop");
    window.addEventListener("scroll", () => toTop.classList.toggle("show", window.scrollY > 400), { passive: true });
    toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  </script>
</body>
</html>
